version: '3.8'
services:
  app:
    build: .
    volumes:
      - .:/src
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: mysql+pymysql://posterr_service:password@db:3306/posterr_db
    working_dir: /src
    depends_on:
      db:
        condition: service_healthy
    command: ["./wait-for-it.sh", "db:3306", "--", "flask", "run", "--host=0.0.0.0", "--port=8080"]

  db:
    build:
      context: ./db
      args:
        MYSQL_VERSION: 8.0
        MYSQL_USER: posterr_service
        MYSQL_PASSWORD: password
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: posterr_db
    ports:
      - "3306:3306"
    volumes:
      - data:/var/lib/mysql
      - ./db/scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 1s
      retries: 10

volumes:
  data:
    driver: local
