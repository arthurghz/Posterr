version: '3.8'
services:
  app:
    build: .
    volumes:
      - .:/src
    ports:
      - "8080:8080"
    environment:
      FLASK_APP: src.py
      FLASK_ENV: development
      DATABASE_URL: mysql+pymysql://user:password@db:3306/posterr_db
    working_dir: /src
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: posterr_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - data:/var/lib/mysql
      - ./data/insert_records.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 1s
      retries: 10
volumes:
  data:
    driver: local